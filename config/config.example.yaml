# Пример конфига. Скопируйте в config/config.yaml и настройте под себя.
# Все секретные значения должны приходить из переменных окружения (.env / GitLab Variables).

server:
  port: "8080"
  read_timeout: 30s
  write_timeout: 30s

database:
  host: localhost
  port: 5432
  user: dormitory_user
  password: ""
  dbname: dormitory_db
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 10

logging:
  level: info
  format: json
  output: stdout

max_bot_token: ""
encryption_key: ""
timezone: "Asia/Irkutsk"

rabbitmq:
  url: "amqp://guest:guest@localhost:5672/"
  exchange_name: "dormitory.eis"
