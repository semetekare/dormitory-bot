  /floors/{id}/rooms:
    get:
      parameters:
      - description: Floor UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.RoomListResponse'
      summary: Rooms on a floor
      tags:
      - Rooms
  /laundry/bookings:
    post:
      consumes:
      - application/json
      parameters:
      - description: Booking
        in: body
        name: body
        required: true
        schema:
          properties:
            date:
              type: string
            machine_id:
              type: string
            slot_end:
              type: string
            slot_start:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.LaundryBookingResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Book a laundry slot
      tags:
      - Laundry
  /laundry/bookings/{id}:
    delete:
      parameters:
      - description: Booking UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.MessageResponse'
      security:
      - BearerAuth: []
      summary: Cancel laundry booking
      tags:
      - Laundry
  /laundry/machines:
    get:
      parameters:
      - description: Dormitory UUID
