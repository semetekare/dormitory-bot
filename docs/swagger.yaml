host: localhost:8080
info:
  contact: {}
  description: REST API for dormitory management mini-app (MAX Messenger).
  title: Dormitory Bot API
  version: "1.0"
paths:
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AuthMeResponse'
      security:
      - BearerAuth: []
      summary: Current user from JWT
      tags:
      - Auth
  /auth/miniapp:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AuthMiniappResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Mini-app login (exchange launch token for JWT)
      tags:
      - Auth
  /auth/verify:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AuthVerifyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Verify phone, get launch token
      tags:
      - Auth
  /chat-links:
    get:
      parameters:
      - description: Dormitory UUID
        in: query
        name: dormitory_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ChatLinkListResponse'
      summary: Chat links for a dormitory
      tags:
      - ChatLinks
  /cleaning/exemptions:
    get:
      parameters:
      - description: Dormitory UUID
        in: query
        name: dormitory_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.CleaningExemptionResponse'
      summary: Cleaning duty exemptions
      tags:
      - Cleaning
  /cleaning/penalties:
    get:
      parameters:
      - description: Dormitory UUID
        in: query
        name: dormitory_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.CleaningPenaltyResponse'
      summary: Penalty cleaning duties
      tags:
      - Cleaning
  /cleaning/schedule:
    get:
      parameters:
      - description: Dormitory UUID
        in: query
        name: dormitory_id
        required: true
        type: string
      - description: Month 1-12
        in: query
        name: month
        type: integer
      - description: Year
        in: query
        name: year
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.CleaningScheduleResponse'
      summary: Cleaning schedule
      tags:
      - Cleaning
  /dormitories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.DormitoryListResponse'
      summary: List all active dormitories
      tags:
      - Dormitories
  /dormitories/{id}:
    get:
      parameters:
      - description: Dormitory UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.DormitoryItem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get dormitory by UUID
      tags:
      - Dormitories
  /dormitories/{id}/floors:
    get:
      parameters:
      - description: Dormitory UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.FloorListResponse'
      summary: Floors of a dormitory
      tags:
      - Dormitories
  /dormitories/{id}/staff:
    get:
      parameters:
      - description: Dormitory UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.StaffListResponse'
      summary: Staff of a dormitory
      tags:
      - Dormitories
  /employees/{id}:
    get:
      parameters:
      - description: Employee UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.EmployeeInfoResponse'
      security:
      - BearerAuth: []
      summary: Employee profile
      tags:
      - Employees
  /employees/{id}/dormitories:
    get:
      parameters:
