services:
  postgres:
    image: postgres:16
    container_name: dormitory-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-dormitory_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-dormitory_password}
      POSTGRES_DB: ${DATABASE_DBNAME:-dormitory_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-dormitory_user} -d ${DATABASE_DBNAME:-dormitory_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dormitory-net

  redis:
    image: redis:7
    container_name: dormitory-bot-redis
    restart: unless-stopped
    command: redis-server ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dormitory-net

  app:
    build: .
    container_name: dormitory-bot-app
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      MOCK_MODE: "false"
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET:-${ENCRYPTION_KEY}}
      SEED_MODE: ${SEED_MODE:-production}
      TIMEZONE: ${TIMEZONE:-Asia/Irkutsk}

      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-dormitory_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-dormitory_password}
      DATABASE_DBNAME: ${DATABASE_DBNAME:-dormitory_db}
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-disable}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}

      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://dormitory:***@host.docker.internal:5672/}
      RABBITMQ_EXCHANGE_NAME: ${RABBITMQ_EXCHANGE_NAME:-dormitory.eis}

      UNIVERSITY_DB_HOST: ${UNIVERSITY_DB_HOST}
      UNIVERSITY_DB_PORT: ${UNIVERSITY_DB_PORT:-3306}
      UNIVERSITY_DB_USER: ${UNIVERSITY_DB_USER}
      UNIVERSITY_DB_PASSWORD: ${UNIVERSITY_DB_PASSWORD}
      UNIVERSITY_DB_DBNAME: ${UNIVERSITY_DB_DBNAME}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config:/root/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dormitory-net

  frontend:
    build: ./frontend
    container_name: dormitory-bot-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - app
    networks:
      - dormitory-net

volumes:
  pgdata:

networks:
  dormitory-net:
    name: dormitory-net
    driver: bridge
